# The local stack.
#
# EVERY published port is a `${*_HOST_PORT:-<conventional default>}` variable, never
# a literal. That is what lets a parallel `git worktree` bring up a second stack
# without editing this file: it sets the offsets in its own `.env`. A hardcoded port
# here is the bug that makes two checkouts un-runnable at the same time — the
# defaults exist so a bare clone with no `.env` still works.
#
# Containers, network, and volumes are namespaced by COMPOSE_PROJECT_NAME (set in
# `.env`, and it must equal the checkout's directory name).

# What `migrate`, `app` and `worker` share. `DATABASE_URL` is overridden because `.env`
# holds the host-side URL, and inside the stack the database is `db`, on 5432.
x-app-image: &app-image
  build:
    context: .
    target: dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-d2_trader}:${POSTGRES_PASSWORD:-d2_trader_local_dev}@db:5432/${POSTGRES_DB:-d2_trader}
  volumes:
    # Bind-mounted for live reload. The venv stays in an anonymous volume so the
    # host's (Windows) .venv never shadows the container's (Linux) one.
    - .:/app
    - /app/.venv
  depends_on:
    db:
      condition: service_healthy
  mem_limit: 1g

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-d2_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-d2_trader_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-d2_trader}
    ports:
      - "${DB_HOST_PORT:-5442}:5432"
    volumes:
      # The parent, not `.../data`: from 18 the image keeps its cluster in a versioned
      # directory below this one, and refuses to start with a volume on the old path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Other services wait on this, so `up -d` returning means the DB is actually
      # accepting connections — not merely that the container started.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-d2_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  # Runs once per `up`. `app` and `worker` wait for it, so neither races the other to
  # apply a migration, and neither starts against an old schema.
  migrate:
    <<: *app-image
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  app:
    <<: *app-image
    restart: unless-stopped
    ports:
      # Loopback only: the dashboard has no login, and it can change alerts and rates.
      - "127.0.0.1:${APP_HOST_PORT:-8010}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-image
    command: ["python", "-m", "d2_trader", "worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
